# Example Nginx site for IMS behind Gunicorn.
# Replace paths, server_name, and upstream with your deployment values.
# If you use WhiteNoise for static files, you can proxy everything to Gunicorn.

upstream ims_gunicorn {
    server 127.0.0.1:8000 fail_timeout=0;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 20M;

    location / {
        proxy_pass http://ims_gunicorn;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
