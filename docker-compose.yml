services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-ims} -d ${DB_NAME:-ims}"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      SECRET_KEY: ${SECRET_KEY}
      DEBUG: ${DEBUG}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS}
      DB_ENGINE: postgres
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: db
      DB_PORT: 5432
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      STATIC_ROOT: /usr/local/share/ims/staticfiles
      MEDIA_ROOT: /usr/local/share/ims/media
    volumes:
      - /usr/local/share/ims/staticfiles:/usr/local/share/ims/staticfiles
      - /usr/local/share/ims/media:/usr/local/share/ims/media

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d/ims.conf:/etc/nginx/conf.d/default.conf:ro
      - /usr/local/share/ims/staticfiles:/usr/local/share/ims/staticfiles:ro
      - /usr/local/share/ims/media:/usr/local/share/ims/media:ro
      - /etc/ssl/certs/subisu.pem:/etc/ssl/certs/subisu.pem:ro
      - /etc/ssl/certs/subisu.net.np.key:/etc/ssl/certs/subisu.net.np.key:ro

volumes:
  postgres_data:
