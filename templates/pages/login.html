{% extends "layout.html" %}
{% block title %}Login — Subisu IMS{% endblock %}
{% block page %}
<div class="login-page">
  <div class="login-card">
    <section class="login-card-panel login-form-panel">
      <div class="text-center mb-4">
        <span class="login-logo mb-3"><i class="bi bi-boxes"></i></span>
        <div class="small text-secondary fw-semibold mb-2">Subisu System</div>
        <h1 class="h3 mb-2">Sign in</h1>
      </div>
      <form id="formLogin">
        <div class="mb-3">
          <label class="form-label">Username</label>
          <input type="text" class="form-control" name="username" required autocomplete="username" />
        </div>
        <div class="mb-3">
          <label class="form-label">Password</label>
          <input type="password" class="form-control" name="password" required autocomplete="current-password" />
        </div>
        <button type="submit" class="btn login-submit text-white w-100">Login</button>
      </form>
      <p class="login-error text-danger small mt-3 mb-0 d-none" id="loginErr"></p>
    </section>
  </div>
</div>
{% endblock %}
{% block scripts %}
<script>
  if (localStorage.getItem("ims_access")) {
    window.location.href = "/";
  }
  document.getElementById("formLogin").addEventListener("submit", async function (e) {
    e.preventDefault();
    const fd = new FormData(e.target);
    const err = document.getElementById("loginErr");
    err.classList.add("d-none");
    try {
      const { data } = await axios.post("/api/v1/auth/login/", {
        username: fd.get("username"),
        password: fd.get("password"),
      });
      localStorage.setItem("ims_access", data.access);
      localStorage.setItem("ims_refresh", data.refresh);
      localStorage.setItem("ims_username", fd.get("username"));
      await ims.loadCurrentUser(true);
      window.location.href = "/";
    } catch (ex) {
      err.textContent = (ex.response && ex.response.data && ex.response.data.detail) || "Invalid credentials";
      err.classList.remove("d-none");
    }
  });
</script>
{% endblock %}
