{% extends "layout.html" %}
{% block title %}Logs — IMS{% endblock %}
{% block page %}
<div class="app-page">
  <div class="page-actions page-header">
    <div>
      <h1 class="h3 mb-1">Logs</h1>
      <p class="text-secondary mb-0">Recent inventory activity in a simpler view.</p>
    </div>
  </div>
  <div class="page-shell">
    <div class="content-panel content-panel-muted p-3 p-lg-4">
      <div class="d-flex flex-wrap gap-2 mb-3">
        <button type="button" class="btn btn-sm btn-outline-secondary log-preset" data-range="today">Today</button>
        <button type="button" class="btn btn-sm btn-outline-secondary log-preset" data-range="week">This week</button>
        <button type="button" class="btn btn-sm btn-outline-secondary log-preset" data-range="mine">My actions</button>
        <button type="button" class="btn btn-sm btn-outline-secondary log-preset" data-range="clear">Clear</button>
      </div>
      <div class="row g-2 align-items-end small">
      <div class="col-md-4 col-lg-3">
        <label class="form-label">Action</label>
        <select class="form-select form-select-sm" id="fAction">
          <option value="">Any</option>
          <option value="added">added</option>
          <option value="deployed">deployed</option>
          <option value="returned">returned</option>
          <option value="removed">removed</option>
          <option value="faulty">faulty</option>
          <option value="qty_changed">qty_changed</option>
          <option value="remark_updated">remark_updated</option>
        </select>
      </div>
      <div class="col-md-4 col-lg-3">
        <label class="form-label">Category</label>
        <select class="form-select form-select-sm" id="fCat"></select>
      </div>
      <div class="col-md-4 col-lg-3">
        <label class="form-label">From</label>
        <input class="form-control form-control-sm" id="fFrom" type="datetime-local" />
      </div>
      <div class="col-lg-3 d-flex gap-2">
        <button type="button" class="btn btn-sm btn-primary flex-grow-1" id="btnApply">Apply</button>
        <button type="button" class="btn btn-sm btn-outline-secondary" id="btnExport">Export</button>
      </div>
      </div>
    </div>
    <div class="content-panel p-3">
      <div class="table-responsive" style="max-height: 75vh">
        <table class="table table-sm table-hover align-middle mb-0">
          <thead class="table-light sticky-top">
            <tr>
              <th>When</th>
              <th>Action</th>
              <th>Item</th>
              <th>Category</th>
              <th>Qty Δ</th>
              <th>User</th>
              <th>Notes</th>
            </tr>
          </thead>
          <tbody id="tblBody">
            <tr><td colspan="7" class="p-3"><div class="ims-loading" style="height:18px"></div></td></tr>
          </tbody>
        </table>
      </div>
      <nav class="mt-3" id="pager"></nav>
    </div>
  </div>
</div>
{% endblock %}
{% block scripts %}
<script>
  (function () {
    ims.bootstrapPage({ activeNav: "history" }).then(function (boot) {
      if (!boot) return;

      function relApiUrl(fullUrl) {
        if (!fullUrl) return null;
        try {
          var u = new URL(fullUrl, window.location.origin);
          return u.pathname + u.search;
        } catch (e) {
          return fullUrl;
        }
      }

      var nextUrl = null;
      var prevUrl = null;

      function load(url) {
        var tb = document.getElementById("tblBody");
        if (window.imsUi) window.imsUi.setLoadingRows(tb, 7, 1);
        else tb.innerHTML = '<tr><td colspan="7" class="p-3"><div class="ims-loading" style="height:18px"></div></td></tr>';
        ims.api.get(url || "/logs/?page_size=50&ordering=-timestamp").then(function (res) {
          var d = res.data;
          var rows = ims.results(d);
          tb.innerHTML = "";
          var actionMap = {
            added: "Added",
            deployed: "Deployed",
            returned: "Returned",
            removed: "Removed",
            faulty: "Marked faulty",
            qty_changed: "Quantity changed",
            remark_updated: "Remark updated",
          };
          rows.forEach(function (log) {
            var tr = document.createElement("tr");
            var spec = log.item ? (log.item.display_name || "Inventory item") : "—";
            var cat = log.item && log.item.category ? (log.item.category.full_name || log.item.category.name) : "—";
            var user = log.performed_by ? log.performed_by.username : "—";
            tr.innerHTML =
              "<td><small>" + ims.escapeHtml(new Date(log.timestamp).toLocaleString()) + "</small></td><td>" +
              ims.escapeHtml(actionMap[log.action] || log.action) + "</td><td>" + ims.escapeHtml(spec) + "</td><td>" + ims.escapeHtml(cat) + "</td><td>" +
              ims.escapeHtml(log.quantity_before + " → " + log.quantity_after) + "</td><td>" + ims.escapeHtml(user) +
              "</td><td><small>" + ims.escapeHtml(log.notes || "") + "</small></td>";
            tb.appendChild(tr);
          });
          if (!rows.length) {
            if (window.imsUi) window.imsUi.setEmptyRow(tb, 7, "No logs match these filters.");
            else tb.innerHTML = '<tr><td colspan="7" class="text-center text-secondary p-4">No logs match these filters.</td></tr>';
          }
          nextUrl = d.next;
          prevUrl = d.previous;
          var pg = document.getElementById("pager");
          pg.innerHTML =
            '<button class="btn btn-sm btn-outline-secondary me-2" id="pgPrev" ' +
            (prevUrl ? "" : "disabled") +
            '>Previous</button><button class="btn btn-sm btn-outline-secondary" id="pgNext" ' +
            (nextUrl ? "" : "disabled") +
            ">Next</button>";
          document.getElementById("pgPrev").onclick = function () {
            var p = relApiUrl(prevUrl);
            if (p) load(p);
          };
          document.getElementById("pgNext").onclick = function () {
            var n = relApiUrl(nextUrl);
            if (n) load(n);
          };
        }).catch(function () {
          ims.showToast("Failed to load logs", "danger");
        });
      }

      ims.api.get("/categories/").then(function (res) {
        var sel = document.getElementById("fCat");
        var o0 = document.createElement("option");
        o0.value = "";
        o0.textContent = "Any";
        sel.appendChild(o0);
        ims.results(res.data).forEach(function (c) {
          var o = document.createElement("option");
          o.value = c.id;
          o.textContent = c.full_name || c.name;
          sel.appendChild(o);
        });
      });

      document.getElementById("btnApply").addEventListener("click", function () {
        var q = "/logs/?page_size=50&ordering=-timestamp";
        var a = document.getElementById("fAction").value;
        var c = document.getElementById("fCat").value;
        var f = document.getElementById("fFrom").value.trim();
        if (a) q += "&action=" + encodeURIComponent(a);
        if (c) q += "&category=" + encodeURIComponent(c);
        if (f) q += "&timestamp_after=" + encodeURIComponent(new Date(f).toISOString());
        load(q);
      });

      document.getElementById("btnExport").addEventListener("click", function () {
        var q = "/export-logs/?ordering=-timestamp";
        var a = document.getElementById("fAction").value;
        var c = document.getElementById("fCat").value;
        var f = document.getElementById("fFrom").value.trim();
        if (a) q += "&action=" + encodeURIComponent(a);
        if (c) q += "&category=" + encodeURIComponent(c);
        if (f) q += "&timestamp_after=" + encodeURIComponent(new Date(f).toISOString());
        window.location.href = "/api/v1" + q;
      });

      document.querySelectorAll(".log-preset").forEach(function (btn) {
        btn.addEventListener("click", function () {
          var range = btn.getAttribute("data-range");
          var now = new Date();
          if (range === "today") {
            var start = new Date(now.getFullYear(), now.getMonth(), now.getDate());
            document.getElementById("fFrom").value = start.toISOString().slice(0, 16);
          } else if (range === "week") {
            var weekStart = new Date(now.getTime() - 6 * 24 * 60 * 60 * 1000);
            document.getElementById("fFrom").value = weekStart.toISOString().slice(0, 16);
          } else if (range === "mine") {
            document.getElementById("fAction").value = "";
            document.getElementById("fCat").value = "";
            document.getElementById("fFrom").value = "";
            load("/logs/?page_size=50&ordering=-timestamp&performed_by=" + encodeURIComponent(boot.user.id));
            return;
          } else {
            document.getElementById("fAction").value = "";
            document.getElementById("fCat").value = "";
            document.getElementById("fFrom").value = "";
          }
          document.getElementById("btnApply").click();
        });
      });

      load();
    });
  })();
</script>
{% endblock %}
