{% extends "layout.html" %}
{% block title %}Edit item — IMS{% endblock %}
{% block page %}
<div class="app-page">
  <div class="page-actions page-header">
    <div>
      <h1 class="h3 mb-1">Edit item</h1>
      <p class="text-secondary mb-0">Update an existing inventory record.</p>
    </div>
  </div>
  <div class="content-panel p-4" style="max-width: 720px">
      <form id="formItem">
        <div class="mb-3">
          <label class="form-label">Category</label>
          <select class="form-select" name="category" required id="selCat"></select>
        </div>
        <div id="dynamicFieldsWrap" class="d-none mb-3">
          <div id="customFieldsContainer"></div>
        </div>
        <div class="mb-3">
          <label class="form-label">Quantity</label>
          <input class="form-control" type="number" min="0" name="quantity" id="fQty" />
        </div>
        <div class="mb-3">
          <label class="form-label">Status</label>
          <select class="form-select" name="status" id="selStatus">
            <option value="in_stock">In stock</option>
            <option value="deployed">Deployed</option>
            <option value="out_of_stock">Out of stock</option>
            <option value="na">N/A</option>
            <option value="faulty">Faulty</option>
          </select>
        </div>
        <div class="mb-3">
          <label class="form-label">Remark</label>
          <textarea class="form-control" name="remark" rows="2" id="fRem"></textarea>
        </div>
        <div class="mb-3">
          <label class="form-label">Activity note</label>
          <textarea class="form-control" name="log_note" rows="2" placeholder="Moved to this location, corrected stock count, returned from deployment, etc."></textarea>
        </div>
        <button type="submit" class="btn btn-primary">Update</button>
        <a href="/inventory/" class="btn btn-link text-decoration-none">Cancel</a>
      </form>
  </div>
</div>
{% endblock %}
{% block scripts %}
<script>
  (function () {
    var params = new URLSearchParams(window.location.search);
    var id = params.get("id");
    var categoryTree = [];
    var itemData = null;
    var currentSchema = [];

    function renderDynamicFields() {
      var categoryId = document.getElementById("selCat").value;
      currentSchema = ims.getCategoryCustomFields(categoryTree, categoryId);
      var existingValues = itemData && String(itemData.category.id) === String(categoryId) ? (itemData.custom_values || {}) : {};
      ims.renderCustomFieldInputs(document.getElementById("customFieldsContainer"), currentSchema, existingValues);
      document.getElementById("dynamicFieldsWrap").classList.toggle("d-none", !currentSchema.length);
    }

    ims.bootstrapPage({ activeNav: "inventory", requireWrite: true }).then(function (boot) {
      if (!boot) return;
      if (!id) {
        ims.showToast("Missing id", "danger");
        return;
      }
      Promise.all([ims.getCategoryTree(), ims.api.get("/items/" + id + "/")]).then(function (res) {
        categoryTree = res[0];
        var sel = document.getElementById("selCat");
        var groups = ims.collectLeafCategories(categoryTree);
        Object.keys(groups).forEach(function (groupName) {
          var og = document.createElement("optgroup");
          og.label = groupName;
          groups[groupName].forEach(function (c) {
            var o = document.createElement("option");
            o.value = c.id;
            // `collectLeafCategories()` returns leaf objects shaped like {id, label, full_name}
            // (not full Category model objects). Render using label/path instead.
            o.textContent = (c.label || "").split(" > ").join(" / ") || c.full_name || String(c.id);
            og.appendChild(o);
          });
          sel.appendChild(og);
        });
        itemData = res[1].data;
        sel.value = itemData.category.id;
        document.getElementById("fQty").value = itemData.quantity;
        document.getElementById("selStatus").value = itemData.status;
        document.getElementById("fRem").value = itemData.remark || "";
        sel.addEventListener("change", renderDynamicFields);
        renderDynamicFields();
      });
    });

    document.getElementById("formItem").addEventListener("submit", function (e) {
      e.preventDefault();
      var fd = new FormData(e.target);
      var payload = {
        category: parseInt(fd.get("category"), 10),
        custom_values: ims.collectCustomFieldValues(e.target, currentSchema),
        quantity: parseInt(fd.get("quantity") || "0", 10),
        status: fd.get("status"),
        remark: fd.get("remark") || "",
        log_note: fd.get("log_note") || "",
      };
      ims.api.patch("/items/" + id + "/", payload).then(function () {
        ims.showToast("Saved", "success");
        window.location.href = "/item/?id=" + id;
      }).catch(function (ex) {
        var msg = (ex.response && ex.response.data && JSON.stringify(ex.response.data)) || "Save failed";
        ims.showToast(msg, "danger");
      });
    });
  })();
</script>
{% endblock %}
