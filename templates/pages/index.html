{% extends "layout.html" %}
{% block title %}Dashboard — Inventory{% endblock %}
{% block page %}
<div class="app-page">
  <div class="page-actions page-header">
    <div>
      <h1 class="h3 mb-1">Dashboard</h1>
      <p class="text-secondary mb-0">Quick overview of stock health and activity.</p>
    </div>
  </div>
  <div class="page-shell">
    <div class="row g-3">
      <div class="col-md-4">
        <a class="content-panel content-panel-muted dashboard-kpi-card h-100 p-0 text-decoration-none text-dark" id="kpiLowCard" href="/inventory/?low_stock=1">
          <div class="dashboard-kpi-body">
            <div class="text-secondary small dashboard-kpi-label">Low stock items</div>
            <div class="dashboard-kpi-value" id="kpiLowCount">—</div>
          </div>
        </a>
      </div>
      <div class="col-md-4">
        <a class="content-panel content-panel-muted dashboard-kpi-card h-100 p-0 text-decoration-none text-dark" id="kpiOutCard" href="/inventory/?status=out_of_stock">
          <div class="dashboard-kpi-body">
            <div class="text-secondary small dashboard-kpi-label">Out of stock items</div>
            <div class="dashboard-kpi-value" id="kpiOutCount">—</div>
          </div>
        </a>
      </div>
      <div class="col-md-4">
        <a class="content-panel content-panel-muted dashboard-kpi-card h-100 p-0 text-decoration-none text-dark" id="kpiRecentCard" href="/inventory/" data-recent-card>
          <div class="dashboard-kpi-body">
            <div class="text-secondary small dashboard-kpi-label">Recently updated (7d)</div>
            <div class="dashboard-kpi-value" id="kpiRecentCount">—</div>
          </div>
        </a>
      </div>
    </div>
    <div class="content-panel content-panel-muted p-3 p-lg-4 mt-3">
      <div class="d-flex justify-content-between align-items-start flex-wrap gap-3">
        <div>
          <div class="h5 mb-0">Category totals</div>
        </div>
      </div>
      <div class="dashboard-category-grid mt-3" id="categoryCards">
        <div class="ims-loading" style="height:18px"></div>
      </div>
    </div>
    <div class="d-none text-center" id="dashboardRetryWrap">
      <button class="btn btn-outline-secondary btn-sm" id="dashboardRetryBtn" type="button">Retry loading dashboard</button>
    </div>
  </div>
</div>
{% endblock %}
{% block scripts %}
<script>
  (function () {
    function renderDashboard() {
      var retryWrap = document.getElementById("dashboardRetryWrap");
      retryWrap.classList.add("d-none");

      document.getElementById("kpiLowCount").textContent = "…";
      document.getElementById("kpiOutCount").textContent = "…";
      document.getElementById("kpiRecentCount").textContent = "…";
      document.getElementById("categoryCards").innerHTML = '<div class="ims-loading" style="height:18px"></div>';
      return ims.api
        .get("/dashboard/")
        .then(function (res) {
          var d = res.data;
          var byStatus = d.count_by_status || {};
          var categoryTotals = d.category_totals || [];
          var now = Date.now();
          var recentWindow = 7 * 24 * 60 * 60 * 1000;
          var updatedAfter = new Date(now - recentWindow).toISOString();
          document.getElementById("kpiLowCount").textContent = d.low_stock_count || 0;
          document.getElementById("kpiOutCount").textContent = byStatus.out_of_stock || 0;
          document.getElementById("kpiRecentCount").textContent = d.recent_updated_count || 0;
          document.querySelector("[data-recent-card]").href = "/inventory/?updated_after=" + encodeURIComponent(updatedAfter);

          var categoryCards = document.getElementById("categoryCards");
          categoryCards.innerHTML = "";
          categoryTotals.forEach(function (cat) {
            var card = document.createElement("a");
            card.className = "dashboard-category-card text-decoration-none";
            card.href = "/inventory/?category=" + encodeURIComponent(cat.id);
            card.innerHTML =
              '<span class="dashboard-category-name">' + ims.escapeHtml(cat.name || cat.full_name) + '</span>' +
              '<strong>' + ims.escapeHtml(cat.total_count || 0) + '</strong>';
            categoryCards.appendChild(card);
          });
          if (!categoryCards.children.length) {
            categoryCards.innerHTML = '<div class="text-secondary small">No categories yet.</div>';
          }
        })
        .catch(function () {
          document.getElementById("categoryCards").innerHTML = '<div class="text-danger small">Could not load category totals.</div>';
          retryWrap.classList.remove("d-none");
          ims.showToast("Could not load dashboard", "danger");
        });
    }

    ims.bootstrapPage({ activeNav: "dashboard" }).then(function (boot) {
      if (!boot) return;
      document.getElementById("dashboardRetryBtn").addEventListener("click", renderDashboard);
      renderDashboard();
    });
  })();
</script>
{% endblock %}
