{% extends "layout.html" %}
{% block title %}Dashboard — Inventory{% endblock %}
{% block page %}
<div class="app-page">
  <div class="page-actions">
    <div>
      <h1 class="h3 mb-1">Dashboard</h1>
      <p class="text-secondary mb-0">Critical inventory attention items.</p>
    </div>
  </div>
  <div class="row g-3 mb-3">
    <div class="col-md-4">
      <a class="card card-soft shadow-sm text-decoration-none text-dark" id="kpiLowCard" href="/inventory.html">
        <div class="card-body">
          <div class="text-secondary small">Low stock items</div>
          <div class="h4 mb-0" id="kpiLowCount">—</div>
        </div>
      </a>
    </div>
    <div class="col-md-4">
      <a class="card card-soft shadow-sm text-decoration-none text-dark" id="kpiOutCard" href="/inventory.html">
        <div class="card-body">
          <div class="text-secondary small">Out of stock items</div>
          <div class="h4 mb-0" id="kpiOutCount">—</div>
        </div>
      </a>
    </div>
    <div class="col-md-4">
      <a class="card card-soft shadow-sm text-decoration-none text-dark" id="kpiRecentCard" href="/inventory.html">
        <div class="card-body">
          <div class="text-secondary small">Recently updated (7d)</div>
          <div class="h4 mb-0" id="kpiRecentCount">—</div>
        </div>
      </a>
    </div>
  </div>
  <div class="row g-3">
    <div class="col-lg-12">
      <div class="card card-soft shadow-sm">
        <div class="card-header bg-white border-0 pt-4 px-4">Low Stock</div>
        <div class="card-body p-0">
          <div class="table-responsive" style="max-height: 360px">
            <table class="table table-sm mb-0">
              <thead class="table-light sticky-top">
                <tr>
                  <th>Item</th>
                  <th>Qty</th>
                  <th></th>
                </tr>
              </thead>
              <tbody id="lowStockBody">
                <tr><td colspan="3" class="p-3"><div class="ims-loading" style="height:18px"></div></td></tr>
                <tr><td colspan="3" class="p-3"><div class="ims-loading" style="height:18px"></div></td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
      <div class="mt-3 d-none text-center" id="dashboardRetryWrap">
        <button class="btn btn-outline-secondary btn-sm" id="dashboardRetryBtn" type="button">Retry loading dashboard</button>
      </div>
    </div>
  </div>
</div>
{% endblock %}
{% block scripts %}
<script>
  (function () {
    function renderDashboard() {
      var lb = document.getElementById("lowStockBody");
      var retryWrap = document.getElementById("dashboardRetryWrap");
      retryWrap.classList.add("d-none");

      if (window.imsUi) window.imsUi.setLoadingRows(lb, 3, 1);
      document.getElementById("kpiLowCount").textContent = "…";
      document.getElementById("kpiOutCount").textContent = "…";
      document.getElementById("kpiRecentCount").textContent = "…";
      return ims.api
        .get("/dashboard/")
        .then(function (res) {
          var d = res.data;
          var low = d.low_stock_items || [];
          var now = Date.now();
          var recentWindow = 7 * 24 * 60 * 60 * 1000;
          var recent = low.filter(function (it) {
            if (!it.last_updated) return false;
            return now - new Date(it.last_updated).getTime() <= recentWindow;
          });
          document.getElementById("kpiLowCount").textContent = low.length;
          document.getElementById("kpiOutCount").textContent = low.filter(function (it) { return Number(it.quantity) <= 0; }).length;
          document.getElementById("kpiRecentCount").textContent = recent.length;
          lb.innerHTML = "";
          if (!low.length) {
            if (window.imsUi) window.imsUi.setEmptyRow(lb, 3, "No low stock items. Great job.");
            else lb.innerHTML = '<tr><td colspan="3" class="text-center text-secondary p-4">No low stock items. Great job.</td></tr>';
            return;
          }
          low.forEach(function (it) {
            var tr = document.createElement("tr");
            tr.innerHTML =
              "<td>" +
              (it.display_name || "Inventory item") +
              "</td><td>" +
              it.quantity +
              '</td><td><a class="btn btn-sm btn-outline-primary" href="/item.html?id=' +
              it.id +
              '">View</a></td>';
            lb.appendChild(tr);
          });
        })
        .catch(function () {
          if (window.imsUi) window.imsUi.setEmptyRow(lb, 3, "Could not load dashboard data.", "text-danger");
          else lb.innerHTML = '<tr><td colspan="3" class="text-center text-danger p-4">Could not load dashboard data.</td></tr>';
          retryWrap.classList.remove("d-none");
          ims.showToast("Could not load dashboard", "danger");
        });
    }

    ims.bootstrapPage({ activeNav: "dashboard" }).then(function (boot) {
      if (!boot) return;
      document.getElementById("dashboardRetryBtn").addEventListener("click", renderDashboard);
      renderDashboard();
    });
  })();
</script>
{% endblock %}
