{% extends "layout.html" %}
{% block title %}Inventory — IMS{% endblock %}
{% block page %}
<div class="app-page">
  <div class="page-actions page-header">
    <div>
      <h1 class="h3 mb-1">Inventory</h1>
      <p class="text-secondary mb-0">Browse stock with quick, focused filters.</p>
    </div>
    <div class="page-actions-group">
      <a class="btn btn-primary" href="/add/" data-requires-write id="btnAddItem">Add item</a>
    </div>
  </div>
  <div class="content-panel p-3 p-lg-4">
    <div class="row g-3 align-items-center mb-3">
      <div class="col-lg-4">
        <input
          type="search"
          class="form-control"
          id="searchQ"
          placeholder="Search category, fields and remark…"
        />
      </div>
      <div class="col-lg-8">
        <div class="inventory-filter-toolbar">
          <select class="form-select form-select-sm" id="categoryFilterSelect">
            <option value="all">All categories</option>
          </select>
          <select class="form-select form-select-sm" id="statusFilter">
            <option value="">Any status</option>
            <option value="in_stock">In stock</option>
            <option value="deployed">Deployed</option>
            <option value="out_of_stock">Out of stock</option>
            <option value="na">N/A</option>
            <option value="faulty">Faulty</option>
          </select>
          <button class="btn btn-outline-secondary btn-sm" id="filterAll" type="button">All categories</button>
          <button class="btn btn-outline-secondary btn-sm" id="clearFilters" type="button">Clear</button>
        </div>
      </div>
    </div>
    <div class="table-responsive" style="max-height: 70vh">
      <table class="table table-sm table-hover align-middle mb-0">
        <thead class="table-light sticky-top">
          <tr id="tableHeadRow"></tr>
        </thead>
        <tbody id="tblBody">
          <tr><td colspan="4" class="p-3"><div class="ims-loading" style="height:18px"></div></td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

{% endblock %}
{% block scripts %}
<script>
  (function () {
    var params = new URLSearchParams(window.location.search);
    var activeCatId = params.get("category") || "all";
    var allItems = [];
    var categoryTree = [];
    var descendantsById = {};
    var sidebarApi = null;
    var searchTimer = null;
    var currentUser = null;
    var lowStockOnly = ["1", "true", "yes"].indexOf((params.get("low_stock") || "").toLowerCase()) >= 0;
    var FILTERS = [
      ["status", "statusFilter"],
    ];

    function toDateLocalParam(value) {
      if (!value) return "";
      var date = new Date(value);
      return Number.isNaN(date.getTime()) ? "" : date.toISOString();
    }

    function itemText(value) {
      return String(value === undefined || value === null ? "" : value).toLowerCase();
    }

    function getFilterValues() {
      var values = {};
      FILTERS.forEach(function (entry) {
        var key = entry[0];
        var el = document.getElementById(entry[1]);
        if (!el) return;
        values[key] = (el.value || "").trim();
      });
      values.low_stock = lowStockOnly;
      return values;
    }

    function syncUrl() {
      var next = new URL(window.location.href);
      if (activeCatId === "all") next.searchParams.delete("category");
      else next.searchParams.set("category", activeCatId);
      var q = (document.getElementById("searchQ").value || "").trim();
      if (!q) next.searchParams.delete("q");
      else next.searchParams.set("q", q);
      var filters = getFilterValues();
      FILTERS.forEach(function (entry) {
        var key = entry[0];
        var value = filters[key];
        if (key === "updated_after" || key === "updated_before" || key === "created_after" || key === "created_before") value = toDateLocalParam(value);
        if (!value) next.searchParams.delete(key);
        else next.searchParams.set(key, value);
      });
      if (filters.low_stock) next.searchParams.set("low_stock", "1");
      else next.searchParams.delete("low_stock");
      window.history.replaceState({}, "", next.pathname + next.search);
    }

    function setActiveCategory(catId) {
      activeCatId = catId || "all";
      syncUrl();
      if (sidebarApi) sidebarApi.setActiveCategory(activeCatId);
      var btnAdd = document.getElementById("btnAddItem");
      if (btnAdd) {
        btnAdd.href = activeCatId && activeCatId !== "all" ? "/add/?category=" + encodeURIComponent(activeCatId) : "/add/";
      }
      var categorySelect = document.getElementById("categoryFilterSelect");
      if (categorySelect.querySelector('option[value="' + activeCatId + '"]')) {
        categorySelect.value = activeCatId;
      } else {
        categorySelect.value = "all";
      }
      renderRows();
    }

    function buildSearchBlob(item) {
      var child = item.child || {};
      var childText = Object.keys(child).map(function (key) {
        return String(child[key]);
      }).join(" ");
      return (
        ((item.category && (item.category.full_name || item.category.name)) || "") +
        " " + (item.name || "") +
        " " + (item.specs || "") +
        " " + (item.brand || "") +
        " " + (item.capacity_display || "") +
        " " + (item.display_name || "") +
        " " + (item.remark || "") +
        " " + childText
      ).toLowerCase();
    }

    function renderCategoryFilterOptions() {
      var select = document.getElementById("categoryFilterSelect");
      select.innerHTML = '<option value="all">All categories</option>';
      var flatLeaf = ims.flattenCategoryTree(categoryTree || []).filter(function (node) {
        return node.is_leaf !== false;
      });
      flatLeaf.sort(function (a, b) {
        return String(a.name || "").localeCompare(String(b.name || ""));
      }).forEach(function (category) {
        var option = document.createElement("option");
        option.value = category.id;
        option.textContent = String(category.name || category.id);
        select.appendChild(option);
      });
      if (select.querySelector('option[value="' + activeCatId + '"]')) select.value = activeCatId;
    }

    function renderTableHead() {
      var head = document.getElementById("tableHeadRow");
      head.innerHTML = "";
      var labels = ["Item", "Quantity", "Remark", "Status", "Actions"];
      labels.forEach(function (label) {
        var th = document.createElement("th");
        th.className = label === "Item" ? "text-start" : "text-center";
        th.textContent = label;
        head.appendChild(th);
      });
    }

    function buildFlatRows() {
      var q = (document.getElementById("searchQ").value || "").toLowerCase();
      var filters = getFilterValues();
      return (allItems || []).filter(function (it) {
        if (
          activeCatId !== "all" &&
          (descendantsById[String(activeCatId)] || []).indexOf(String(it.category.id)) < 0
        ) return false;
        if (q && buildSearchBlob(it).indexOf(q) < 0) return false;
        if (filters.status && it.status !== filters.status) return false;
        if (filters.name && itemText(it.name || it.display_name).indexOf(filters.name.toLowerCase()) < 0) return false;
        if (filters.specs && itemText(it.specs).indexOf(filters.specs.toLowerCase()) < 0) return false;
        if (filters.brand && itemText(it.brand).indexOf(filters.brand.toLowerCase()) < 0) return false;
        if (filters.capacity_unit && itemText(it.capacity_unit).indexOf(filters.capacity_unit.toLowerCase()) < 0) return false;
        if (filters.remark && itemText(it.remark).indexOf(filters.remark.toLowerCase()) < 0) return false;
        if (filters.activity_note && itemText(it.activity_note).indexOf(filters.activity_note.toLowerCase()) < 0) return false;
        if (filters.quantity_min && Number(it.quantity) < Number(filters.quantity_min)) return false;
        if (filters.quantity_max && Number(it.quantity) > Number(filters.quantity_max)) return false;
        if (filters.capacity_min && Number(it.capacity_value || 0) < Number(filters.capacity_min)) return false;
        if (filters.capacity_max && Number(it.capacity_value || 0) > Number(filters.capacity_max)) return false;
        if (filters.low_stock && Number(it.quantity) > 2) return false;
        if (filters.updated_after && (!it.last_updated || new Date(it.last_updated) < new Date(filters.updated_after))) return false;
        if (filters.updated_before && (!it.last_updated || new Date(it.last_updated) > new Date(filters.updated_before))) return false;
        if (filters.created_after && (!it.created_at || new Date(it.created_at) < new Date(filters.created_after))) return false;
        if (filters.created_before && (!it.created_at || new Date(it.created_at) > new Date(filters.created_before))) return false;
        return true;
      }).sort(function (a, b) {
        var aKey = ims.formatCategoryLeaf(a.category) + " / " + String(a.specs || a.display_name || "");
        var bKey = ims.formatCategoryLeaf(b.category) + " / " + String(b.specs || b.display_name || "");
        return aKey.localeCompare(bKey);
      });
    }

    function renderRows() {
      var tb = document.getElementById("tblBody");
      tb.innerHTML = "";
      var rows = buildFlatRows();
      var colCount = 5;
      renderTableHead();

      rows.forEach(function (it) {
        var tr = document.createElement("tr");
        var backParam = encodeURIComponent(window.location.pathname + window.location.search);
        var actions = '<a class="btn btn-sm btn-outline-secondary" href="/item/?id=' + encodeURIComponent(it.id) + "&back=" + backParam + '">View</a>';
        var specsText = String(it.specs || it.name || it.brand || ims.formatCategoryLeaf(it.category) || "Inventory item").trim();
        var categoryBadge = '<span class="item-meta-badge">' + ims.escapeHtml(ims.formatCategoryLeaf(it.category) || "—") + "</span>";
        var capacityBadge = '<span class="item-meta-badge">' + ims.escapeHtml((it.capacity_display || "").trim() || "—") + "</span>";
        tr.innerHTML = [
          "<td class=\"item-list-cell\"><div class=\"d-flex align-items-center gap-3\">" +
            ims.renderItemImage(it) +
            "<div><a class=\"fw-semibold item-title-link\" href=\"/item/?id=" + encodeURIComponent(it.id) + "&back=" + backParam + "\">" + ims.escapeHtml(specsText) + "</a>" +
            '<div class="item-meta-badges">' + categoryBadge + capacityBadge + "</div></div></div></td>",
          "<td class=\"text-center\">" + ims.escapeHtml(it.quantity) + "</td>",
          "<td class=\"text-center\"><small class=\"text-secondary\">" + ims.escapeHtml(it.remark || "—") + "</small></td>",
          "<td class=\"text-center\">" + ims.statusBadge(it.status) + "</td>",
          "<td class=\"text-center\"><div class=\"d-flex flex-wrap gap-2 justify-content-center\">" + actions + "</div></td>",
        ].join("");
        tb.appendChild(tr);
      });

      if (!tb.children.length) {
        if (window.imsUi) window.imsUi.setEmptyRow(tb, colCount, "No matching items.");
        else tb.innerHTML = '<tr><td colspan="' + colCount + '" class="text-center text-secondary p-4">No matching items.</td></tr>';
      }
      syncUrl();
    }

    ims.bootstrapPage({ activeNav: "inventory", skipSidebar: true }).then(function (boot) {
      if (!boot) return;
      currentUser = boot.user;
      return Promise.all([ims.getCategoryTree(), ims.getInventoryItems()]).then(function (res) {
        categoryTree = res[0];
        allItems = res[1];
        descendantsById = ims.buildCategoryIndexes(categoryTree).descendantsById;
        renderCategoryFilterOptions();
        return ims.initSidebar({
          activeNav: "inventory",
          activeCategoryId: activeCatId,
          categoryTree: categoryTree,
          categoryCounts: ims.countItemsByCategory(allItems),
          currentUser: currentUser,
          onCategorySelect: function (categoryId) {
            setActiveCategory(categoryId);
          },
        }).then(function (sidebar) {
          sidebarApi = sidebar;
          document.getElementById("searchQ").value = params.get("q") || "";
          FILTERS.forEach(function (entry) {
            var key = entry[0];
            var el = document.getElementById(entry[1]);
            var value = params.get(key) || "";
            if ((key === "updated_after" || key === "updated_before" || key === "created_after" || key === "created_before") && value) {
              var date = new Date(value);
              if (!Number.isNaN(date.getTime())) value = date.toISOString().slice(0, 16);
            }
            if (el) el.value = value;
          });
          setActiveCategory(activeCatId);
          renderRows();
        });
      });
    }).catch(function () {
      ims.showToast("Failed to load inventory", "danger");
    });

    document.getElementById("filterAll").addEventListener("click", function () {
      setActiveCategory("all");
    });

    document.getElementById("clearFilters").addEventListener("click", function () {
      document.getElementById("searchQ").value = "";
      FILTERS.forEach(function (entry) {
        var el = document.getElementById(entry[1]);
        if (el) el.value = "";
      });
      lowStockOnly = false;
      setActiveCategory("all");
    });

    document.getElementById("searchQ").addEventListener("input", function () {
      clearTimeout(searchTimer);
      searchTimer = setTimeout(renderRows, 180);
    });

    document.getElementById("categoryFilterSelect").addEventListener("change", function () {
      setActiveCategory(this.value);
    });

    document.getElementById("statusFilter").addEventListener("change", renderRows);

  })();
</script>
{% endblock %}
