{% extends "layout.html" %}
{% block title %}Inventory — IMS{% endblock %}
{% block page %}
<div class="app-page">
  <div class="page-actions page-header">
    <div>
      <h1 class="h3 mb-1">Inventory</h1>
      <p class="text-secondary mb-0">Browse grouped stock by category path and filter by search text.</p>
    </div>
    <div class="page-actions-group">
      <a class="btn btn-primary" href="/add/" data-requires-write id="btnAddItem">Add item</a>
    </div>
  </div>
  <div class="content-panel p-3 p-lg-4">
    <div class="row g-3 align-items-center mb-3">
      <div class="col-lg-5">
        <input
          type="search"
          class="form-control"
          id="searchQ"
          placeholder="Search category, fields and remark…"
        />
      </div>
      <div class="col-lg-7 text-lg-end">
        <select class="form-select form-select-sm d-inline-block me-2 mb-2" style="width: 240px" id="categoryFilterSelect">
          <option value="all">All categories</option>
        </select>
        <button class="btn btn-outline-secondary btn-sm" id="filterAll" type="button">
          Show all categories
        </button>
      </div>
    </div>
    <div class="table-responsive" style="max-height: 70vh">
      <table class="table table-sm table-hover align-middle mb-0">
        <thead class="table-light sticky-top">
          <tr id="tableHeadRow"></tr>
        </thead>
        <tbody id="tblBody">
          <tr><td colspan="4" class="p-3"><div class="ims-loading" style="height:18px"></div></td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<div class="modal fade" id="manageGroupModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-lg modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header">
        <div>
          <h5 class="modal-title mb-0">Manage items</h5>
          <div class="text-secondary small" id="manageGroupSubtitle"></div>
        </div>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <div class="table-responsive">
          <table class="table table-sm align-middle mb-0">
            <thead class="table-light">
              <tr>
                <th>Item</th>
                <th>Qty</th>
                <th>Status</th>
                <th>Remark</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="manageGroupBody"></tbody>
          </table>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Close</button>
      </div>
    </div>
  </div>
</div>
{% endblock %}
{% block scripts %}
<script>
  (function () {
    var params = new URLSearchParams(window.location.search);
    var activeCatId = params.get("category") || "all";
    var allItems = [];
    var categoryTree = [];
    var descendantsById = {};
    var sidebarApi = null;
    var searchTimer = null;
    var currentUser = null;
    var manageModal = null;

    function syncUrl() {
      var next = new URL(window.location.href);
      if (activeCatId === "all") next.searchParams.delete("category");
      else next.searchParams.set("category", activeCatId);
      var q = (document.getElementById("searchQ").value || "").trim();
      if (!q) next.searchParams.delete("q");
      else next.searchParams.set("q", q);
      window.history.replaceState({}, "", next.pathname + next.search);
    }

    function setActiveCategory(catId) {
      activeCatId = catId || "all";
      syncUrl();
      if (sidebarApi) sidebarApi.setActiveCategory(activeCatId);
      var btnAdd = document.getElementById("btnAddItem");
      if (btnAdd) {
        btnAdd.href = activeCatId && activeCatId !== "all" ? "/add/?category=" + encodeURIComponent(activeCatId) : "/add/";
      }
      var categorySelect = document.getElementById("categoryFilterSelect");
      if (categorySelect.querySelector('option[value="' + activeCatId + '"]')) {
        categorySelect.value = activeCatId;
      } else {
        categorySelect.value = "all";
      }
      renderRows();
    }

    function buildSearchBlob(item) {
      var customText = Object.keys(item.custom_values || {}).map(function (key) {
        return String(item.custom_values[key]);
      }).join(" ");
      return (
        ((item.category && (item.category.full_name || item.category.name)) || "") +
        " " + (item.display_name || "") +
        " " + (item.remark || "") +
        " " + customText
      ).toLowerCase();
    }

    function resolveGroupLabel(item) {
      if (!item) return "";
      var schema = (item.category && item.category.custom_fields) ? item.category.custom_fields : [];
      var values = item.custom_values || {};
      for (var i = 0; i < schema.length; i += 1) {
        var field = schema[i];
        var v = values[field.name];
        if (v !== undefined && v !== null && String(v).trim() !== "") return String(v).trim();
      }
      // Fallback to API-provided display_name
      return String(item.display_name || "").trim();
    }

    function renderCategoryFilterOptions() {
      var select = document.getElementById("categoryFilterSelect");
      var groups = ims.collectLeafCategories(categoryTree);
      select.innerHTML = '<option value="all">All categories</option>';
      Object.keys(groups).forEach(function (groupName) {
        var optgroup = document.createElement("optgroup");
        optgroup.label = groupName;
        groups[groupName].forEach(function (category) {
          var option = document.createElement("option");
          option.value = category.id;
          // `collectLeafCategories()` returns leaf objects shaped like {id, label, full_name}
          // (not full Category model objects). Render using label/path instead.
          option.textContent = (category.label || "").split(" > ").join(" / ") || category.full_name || String(category.id);
          optgroup.appendChild(option);
        });
        select.appendChild(optgroup);
      });
      if (select.querySelector('option[value="' + activeCatId + '"]')) select.value = activeCatId;
    }

    function renderTableHead() {
      var head = document.getElementById("tableHeadRow");
      head.innerHTML = "";
      var labels = ["Category", "Group", "Stock", "Items", "Updated"];
      if (currentUser && ims.canManageInventory(currentUser)) labels.push("Actions");
      labels.forEach(function (label) {
        var th = document.createElement("th");
        th.textContent = label;
        head.appendChild(th);
      });
    }

    function buildGroupedRows() {
      var q = (document.getElementById("searchQ").value || "").toLowerCase();
      var grouped = {};

      allItems.forEach(function (it) {
        if (
          activeCatId !== "all" &&
          (descendantsById[String(activeCatId)] || []).indexOf(String(it.category.id)) < 0
        ) return;

        if (q && buildSearchBlob(it).indexOf(q) < 0) return;

        var groupLabel = resolveGroupLabel(it);
        var key = String(it.category.id) + "::" + String(groupLabel).trim().toLowerCase();
        if (!grouped[key]) {
          grouped[key] = {
            categoryId: String(it.category.id),
            categoryPath: ims.formatCategoryLeaf(it.category),
            groupLabel: String(groupLabel || "").trim(),
            quantity: 0,
            itemRows: 0,
            lastUpdated: it.last_updated || null,
          };
        }

        grouped[key].quantity += Number(it.quantity) || 0;
        grouped[key].itemRows += 1;

        if (it.last_updated && (!grouped[key].lastUpdated || new Date(it.last_updated) > new Date(grouped[key].lastUpdated))) {
          grouped[key].lastUpdated = it.last_updated;
        }
      });

      return Object.keys(grouped).map(function (key) {
        return grouped[key];
      }).sort(function (a, b) {
        var aKey = (a.categoryPath || "") + " / " + (a.groupLabel || "");
        var bKey = (b.categoryPath || "") + " / " + (b.groupLabel || "");
        return aKey.localeCompare(bKey);
      });
    }

    function findMatchingItems(row) {
      var targetCat = String(row.categoryId);
      var targetGroup = String(row.groupLabel || "").trim().toLowerCase();
      return (allItems || []).filter(function (it) {
        if (!it.category || String(it.category.id) !== targetCat) return false;
        return resolveGroupLabel(it).toLowerCase() === targetGroup;
      });
    }

    function openManageModal(row) {
      if (!manageModal) manageModal = bootstrap.Modal.getOrCreateInstance(document.getElementById("manageGroupModal"));
      var subtitle = document.getElementById("manageGroupSubtitle");
      subtitle.textContent = (row.categoryPath || "—") + " / " + (row.groupLabel || "—");

      var items = findMatchingItems(row);

      var body = document.getElementById("manageGroupBody");
      body.innerHTML = "";
      items.forEach(function (it) {
        var tr = document.createElement("tr");
        var itemLabel = ims.formatItemPath(it);
        tr.innerHTML = [
          "<td><a href=\"/item/?id=" + encodeURIComponent(it.id) + "\">" + ims.escapeHtml(itemLabel) + "</a></td>",
          "<td>" + ims.escapeHtml(it.quantity) + "</td>",
          "<td>" + ims.statusBadge(it.status) + "</td>",
          "<td><small class=\"text-secondary\">" + ims.escapeHtml(it.remark || "—") + "</small></td>",
          "<td class=\"text-end\"><div class=\"d-flex flex-wrap gap-2 justify-content-end\">"
          + "<a class=\"btn btn-sm btn-primary\" href=\"/edit/?id=" + encodeURIComponent(it.id) + "\" data-requires-write>Edit</a>"
          + "<button type=\"button\" class=\"btn btn-sm btn-outline-danger\" data-requires-write data-remove-item=\"1\" data-item-id=\"" + String(it.id) + "\">Remove</button>"
          + "</div></td>",
        ].join("");
        body.appendChild(tr);
      });
      if (!items.length) {
        if (window.imsUi) window.imsUi.setEmptyRow(body, 5, "No items found for this group.");
        else body.innerHTML = '<tr><td colspan="5" class="text-center text-secondary p-3">No items found for this group.</td></tr>';
      }
      if (items.length) ims.applyPermissionVisibility(document.getElementById("manageGroupModal"), currentUser);

      body.querySelectorAll("[data-remove-item]").forEach(function (btn) {
        btn.addEventListener("click", function (e) {
          e.preventDefault();
          e.stopPropagation();
          var itemId = btn.getAttribute("data-item-id");
          if (!itemId) return;
          if (!window.confirm("Remove this item?")) return;

          ims.api
            .delete("/items/" + itemId + "/")
            .then(function () {
              ims.showToast("Item removed", "success");
              allItems = (allItems || []).filter(function (x) {
                return String(x.id) !== String(itemId);
              });
              if (sidebarApi && typeof sidebarApi.setCategoryCounts === "function") {
                sidebarApi.setCategoryCounts(ims.countItemsByCategory(allItems));
              }
              renderRows();
              if (manageModal) manageModal.hide();
            })
            .catch(function (ex) {
              var msg = (ex.response && ex.response.data && JSON.stringify(ex.response.data)) || "Delete failed";
              ims.showToast(msg, "danger");
            });
        });
      });
      manageModal.show();
    }

    function renderRows() {
      var tb = document.getElementById("tblBody");
      tb.innerHTML = "";
      var groupedRows = buildGroupedRows();
      var colCount = (currentUser && ims.canManageInventory(currentUser)) ? 6 : 5;
      renderTableHead();

      groupedRows.forEach(function (row) {
        var tr = document.createElement("tr");
        var cells = [
          "<td><small>" + ims.escapeHtml(row.categoryPath || "—") + "</small></td>",
          "<td>" + ims.escapeHtml(row.groupLabel || "—") + "</td>",
          "<td>" + ims.escapeHtml(row.quantity) + "</td>",
          "<td><small class=\"text-secondary\">" + ims.escapeHtml(row.itemRows) + "</small></td>",
          "<td><small>" + ims.escapeHtml(row.lastUpdated ? new Date(row.lastUpdated).toLocaleString() : "—") + "</small></td>",
        ];
        if (currentUser && ims.canManageInventory(currentUser)) {
          cells.push('<td class="text-end"><button class="btn btn-sm btn-outline-primary" type="button" data-manage-row="1">Manage</button></td>');
        }
        tr.innerHTML = cells.join("");
        if (currentUser && ims.canManageInventory(currentUser)) {
          tr.querySelectorAll("[data-manage-row]").forEach(function (btn) {
            btn.addEventListener("click", function (e) {
              e.preventDefault();
              e.stopPropagation();
              openManageModal(row);
            });
          });
        }
        tb.appendChild(tr);
      });

      if (!tb.children.length) {
        if (window.imsUi) window.imsUi.setEmptyRow(tb, colCount, "No matching grouped inventory.");
        else tb.innerHTML = '<tr><td colspan="' + colCount + '" class="text-center text-secondary p-4">No matching grouped inventory.</td></tr>';
      }
      syncUrl();
    }

    ims.bootstrapPage({ activeNav: "inventory", skipSidebar: true }).then(function (boot) {
      if (!boot) return;
      currentUser = boot.user;
      return Promise.all([ims.getCategoryTree(), ims.getInventoryItems()]).then(function (res) {
        categoryTree = res[0];
        allItems = res[1];
        descendantsById = ims.buildCategoryIndexes(categoryTree).descendantsById;
        renderCategoryFilterOptions();
        // Materialize category id inside grouped rows by adding categoryId in buildGroupedRows.
        return ims.initSidebar({
          activeNav: "inventory",
          activeCategoryId: activeCatId,
          categoryTree: categoryTree,
          categoryCounts: ims.countItemsByCategory(allItems),
          currentUser: currentUser,
          onCategorySelect: function (categoryId) {
            setActiveCategory(categoryId);
          },
        }).then(function (sidebar) {
          sidebarApi = sidebar;
          document.getElementById("searchQ").value = params.get("q") || "";
          setActiveCategory(activeCatId);
          renderRows();
        });
      });
    }).catch(function () {
      ims.showToast("Failed to load inventory", "danger");
    });

    document.getElementById("filterAll").addEventListener("click", function () {
      setActiveCategory("all");
    });

    document.getElementById("searchQ").addEventListener("input", function () {
      clearTimeout(searchTimer);
      searchTimer = setTimeout(renderRows, 180);
    });

    document.getElementById("categoryFilterSelect").addEventListener("change", function () {
      setActiveCategory(this.value);
    });
  })();
</script>
{% endblock %}
