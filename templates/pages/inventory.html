{% extends "layout.html" %}
{% block title %}Inventory — IMS{% endblock %}
{% block page %}
<div class="app-page">
  <div class="page-actions">
    <div>
      <h1 class="h3 mb-1">Inventory</h1>
      <p class="text-secondary mb-0">Browse stock by category and filter by search text.</p>
    </div>
    <div class="page-actions-group">
      <a class="btn btn-primary" href="/add.html" data-requires-write>Add item</a>
    </div>
  </div>
  <div class="content-panel p-3 p-lg-4">
    <div class="row g-3 align-items-center mb-3">
      <div class="col-lg-5">
        <input
          type="search"
          class="form-control"
          id="searchQ"
          placeholder="Search specs, capacity, remark…"
        />
      </div>
      <div class="col-lg-7 text-lg-end">
        <button class="btn btn-outline-secondary btn-sm" id="filterAll" type="button">
          Show all categories
        </button>
      </div>
    </div>
    <div class="table-responsive" style="max-height: 70vh">
      <table class="table table-sm table-hover align-middle mb-0">
        <thead class="table-light sticky-top">
          <tr>
            <th>Category</th>
            <th>Specs</th>
            <th>Capacity</th>
            <th>Qty</th>
            <th>Status</th>
            <th>Deployed to</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="tblBody"></tbody>
      </table>
    </div>
  </div>
</div>
{% endblock %}
{% block scripts %}
<script>
  (function () {
    var params = new URLSearchParams(window.location.search);
    var activeCatId = params.get("category") || "all";
    var allItems = [];
    var descendantsById = {};
    var sidebarApi = null;
    var searchTimer = null;
    var currentUser = null;

    function syncUrl() {
      var next = new URL(window.location.href);
      if (activeCatId === "all") next.searchParams.delete("category");
      else next.searchParams.set("category", activeCatId);
      window.history.replaceState({}, "", next.pathname + next.search);
    }

    function setActiveCategory(catId) {
      activeCatId = catId || "all";
      syncUrl();
      if (sidebarApi) sidebarApi.setActiveCategory(activeCatId);
      renderRows();
    }

    function renderRows() {
      var tb = document.getElementById("tblBody");
      tb.innerHTML = "";
      var q = (document.getElementById("searchQ").value || "").toLowerCase();

      allItems.forEach(function (it) {
        if (
          activeCatId !== "all" &&
          (descendantsById[String(activeCatId)] || []).indexOf(String(it.category.id)) < 0
        ) return;

        if (q) {
          var blob =
            ((it.category && (it.category.full_name || it.category.name)) || "") +
            " " + (it.specs || "") + " " + (it.capacity || "") + " " + (it.remark || "");
          if (blob.toLowerCase().indexOf(q) < 0) return;
        }

        var tr = document.createElement("tr");
        var actions = '<a class="btn btn-sm btn-outline-primary" href="/item.html?id=' + it.id + '">View</a>';
        if (ims.canManageInventory(currentUser)) {
          actions += ' <a class="btn btn-sm btn-outline-secondary" href="/edit.html?id=' + it.id + '">Edit</a>';
        }
        tr.innerHTML =
          "<td><small>" +
          ((it.category && (it.category.full_name || it.category.name)) || "—") +
          "</small></td><td>" +
          it.specs +
          "</td><td>" +
          (it.capacity || "—") +
          "</td><td>" +
          it.quantity +
          "</td><td>" +
          ims.statusBadge(it.status) +
          "</td><td><small>" +
          (it.deployed_to || "—") +
          "</small></td><td>" +
          actions +
          "</td>";
        tb.appendChild(tr);
      });
    }

    ims.bootstrapPage({ activeNav: "inventory" }).then(function (boot) {
      if (!boot) return;
      currentUser = boot.user;
      return Promise.all([ims.getCategoryTree(), ims.getInventoryItems()]).then(function (res) {
        var tree = res[0];
        allItems = res[1];
        descendantsById = ims.buildCategoryIndexes(tree).descendantsById;
        return ims.initSidebar({
          activeNav: "inventory",
          activeCategoryId: activeCatId,
          categoryTree: tree,
          categoryCounts: ims.countItemsByCategory(allItems),
          currentUser: currentUser,
          onCategorySelect: function (categoryId) {
            setActiveCategory(categoryId);
          },
        }).then(function (sidebar) {
          sidebarApi = sidebar;
          renderRows();
        });
      });
    }).catch(function () {
      ims.showToast("Failed to load inventory", "danger");
    });

    document.getElementById("filterAll").addEventListener("click", function () {
      setActiveCategory("all");
    });

    document.getElementById("searchQ").addEventListener("input", function () {
      clearTimeout(searchTimer);
      searchTimer = setTimeout(renderRows, 180);
    });
  })();
</script>
{% endblock %}
