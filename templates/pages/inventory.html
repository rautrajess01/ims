{% extends "layout.html" %}
{% block title %}Inventory — IMS{% endblock %}
{% block page %}
<div class="app-page">
  <div class="page-actions page-header">
    <div>
      <h1 class="h3 mb-1">Inventory</h1>
      <p class="text-secondary mb-0">Browse grouped stock by category path and filter by search text.</p>
    </div>
    <div class="page-actions-group">
      <a class="btn btn-primary" href="/add/" data-requires-write id="btnAddItem">Add item</a>
    </div>
  </div>
  <div class="content-panel p-3 p-lg-4">
    <div class="row g-3 align-items-center mb-3">
      <div class="col-lg-5">
        <input
          type="search"
          class="form-control"
          id="searchQ"
          placeholder="Search category, fields and remark…"
        />
      </div>
      <div class="col-lg-7 text-lg-end">
        <select class="form-select form-select-sm d-inline-block me-2 mb-2" style="width: 240px" id="categoryFilterSelect">
          <option value="all">All categories</option>
        </select>
        <button class="btn btn-outline-secondary btn-sm" id="filterAll" type="button">
          Show all categories
        </button>
      </div>
    </div>
    <div class="table-responsive" style="max-height: 70vh">
      <table class="table table-sm table-hover align-middle mb-0">
        <thead class="table-light sticky-top">
          <tr id="tableHeadRow"></tr>
        </thead>
        <tbody id="tblBody">
          <tr><td colspan="4" class="p-3"><div class="ims-loading" style="height:18px"></div></td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

{% endblock %}
{% block scripts %}
<script>
  (function () {
    var params = new URLSearchParams(window.location.search);
    var activeCatId = params.get("category") || "all";
    var allItems = [];
    var categoryTree = [];
    var descendantsById = {};
    var sidebarApi = null;
    var searchTimer = null;
    var currentUser = null;

    function syncUrl() {
      var next = new URL(window.location.href);
      if (activeCatId === "all") next.searchParams.delete("category");
      else next.searchParams.set("category", activeCatId);
      var q = (document.getElementById("searchQ").value || "").trim();
      if (!q) next.searchParams.delete("q");
      else next.searchParams.set("q", q);
      window.history.replaceState({}, "", next.pathname + next.search);
    }

    function setActiveCategory(catId) {
      activeCatId = catId || "all";
      syncUrl();
      if (sidebarApi) sidebarApi.setActiveCategory(activeCatId);
      var btnAdd = document.getElementById("btnAddItem");
      if (btnAdd) {
        btnAdd.href = activeCatId && activeCatId !== "all" ? "/add/?category=" + encodeURIComponent(activeCatId) : "/add/";
      }
      var categorySelect = document.getElementById("categoryFilterSelect");
      if (categorySelect.querySelector('option[value="' + activeCatId + '"]')) {
        categorySelect.value = activeCatId;
      } else {
        categorySelect.value = "all";
      }
      renderRows();
    }

    function buildSearchBlob(item) {
      var customText = Object.keys(item.custom_values || {}).map(function (key) {
        return String(item.custom_values[key]);
      }).join(" ");
      return (
        ((item.category && (item.category.full_name || item.category.name)) || "") +
        " " + (item.specs || "") +
        " " + (item.capacity || "") +
        " " + (item.display_name || "") +
        " " + (item.remark || "") +
        " " + customText
      ).toLowerCase();
    }

    function renderCategoryFilterOptions() {
      var select = document.getElementById("categoryFilterSelect");
      var groups = ims.collectLeafCategories(categoryTree);
      select.innerHTML = '<option value="all">All categories</option>';
      Object.keys(groups).forEach(function (groupName) {
        var optgroup = document.createElement("optgroup");
        optgroup.label = groupName;
        groups[groupName].forEach(function (category) {
          var option = document.createElement("option");
          option.value = category.id;
          // `collectLeafCategories()` returns leaf objects shaped like {id, label, full_name}
          // (not full Category model objects). Render using label/path instead.
          option.textContent = (category.label || "").split(" > ").join(" / ") || category.full_name || String(category.id);
          optgroup.appendChild(option);
        });
        select.appendChild(optgroup);
      });
      if (select.querySelector('option[value="' + activeCatId + '"]')) select.value = activeCatId;
    }

    function renderTableHead() {
      var head = document.getElementById("tableHeadRow");
      head.innerHTML = "";
      var labels = ["Category", "Specs", "Capacity", "Quantity", "Remark", "Status", "Actions"];
      labels.forEach(function (label) {
        var th = document.createElement("th");
        th.textContent = label;
        head.appendChild(th);
      });
    }

    function buildFlatRows() {
      var q = (document.getElementById("searchQ").value || "").toLowerCase();
      return (allItems || []).filter(function (it) {
        if (
          activeCatId !== "all" &&
          (descendantsById[String(activeCatId)] || []).indexOf(String(it.category.id)) < 0
        ) return false;
        if (q && buildSearchBlob(it).indexOf(q) < 0) return false;
        return true;
      }).sort(function (a, b) {
        var aKey = ims.formatCategoryLeaf(a.category) + " / " + String(a.specs || a.display_name || "");
        var bKey = ims.formatCategoryLeaf(b.category) + " / " + String(b.specs || b.display_name || "");
        return aKey.localeCompare(bKey);
      });
    }

    function renderRows() {
      var tb = document.getElementById("tblBody");
      tb.innerHTML = "";
      var rows = buildFlatRows();
      var colCount = 7;
      renderTableHead();

      rows.forEach(function (it) {
        var tr = document.createElement("tr");
        var canWrite = currentUser && ims.canManageInventory(currentUser);
        var actions = '<a class="btn btn-sm btn-outline-secondary" href="/item/?id=' + encodeURIComponent(it.id) + '">View</a>';
        if (canWrite) {
          actions =
            '<a class="btn btn-sm btn-outline-secondary" href="/item/?id=' + encodeURIComponent(it.id) + '">View</a>' +
            '<a class="btn btn-sm btn-primary" href="/edit/?id=' + encodeURIComponent(it.id) + '" data-requires-write>Edit</a>' +
            '<button type="button" class="btn btn-sm btn-outline-danger" data-requires-write data-remove-item="1" data-item-id="' + ims.escapeHtml(it.id) + '">Remove</button>';
        }
        var specsText = String(it.specs || it.display_name || ("Item #" + it.id)).trim();
        tr.innerHTML = [
          "<td><small>" + ims.escapeHtml(ims.formatCategoryLeaf(it.category) || "—") + "</small></td>",
          "<td><a class=\"fw-semibold\" href=\"/item/?id=" + encodeURIComponent(it.id) + "\">" + ims.escapeHtml(specsText) + "</a></td>",
          "<td><small class=\"text-secondary\">" + ims.escapeHtml((it.capacity || "").trim() || "—") + "</small></td>",
          "<td>" + ims.escapeHtml(it.quantity) + "</td>",
          "<td><small class=\"text-secondary\">" + ims.escapeHtml(it.remark || "—") + "</small></td>",
          "<td>" + ims.statusBadge(it.status) + "</td>",
          "<td class=\"text-end\"><div class=\"d-flex flex-wrap gap-2 justify-content-end\">" + actions + "</div></td>",
        ].join("");
        tb.appendChild(tr);
      });

      if (!tb.children.length) {
        if (window.imsUi) window.imsUi.setEmptyRow(tb, colCount, "No matching items.");
        else tb.innerHTML = '<tr><td colspan="' + colCount + '" class="text-center text-secondary p-4">No matching items.</td></tr>';
      }
      syncUrl();
    }

    ims.bootstrapPage({ activeNav: "inventory", skipSidebar: true }).then(function (boot) {
      if (!boot) return;
      currentUser = boot.user;
      return Promise.all([ims.getCategoryTree(), ims.getInventoryItems()]).then(function (res) {
        categoryTree = res[0];
        allItems = res[1];
        descendantsById = ims.buildCategoryIndexes(categoryTree).descendantsById;
        renderCategoryFilterOptions();
        return ims.initSidebar({
          activeNav: "inventory",
          activeCategoryId: activeCatId,
          categoryTree: categoryTree,
          categoryCounts: ims.countItemsByCategory(allItems),
          currentUser: currentUser,
          onCategorySelect: function (categoryId) {
            setActiveCategory(categoryId);
          },
        }).then(function (sidebar) {
          sidebarApi = sidebar;
          document.getElementById("searchQ").value = params.get("q") || "";
          setActiveCategory(activeCatId);
          renderRows();
        });
      });
    }).catch(function () {
      ims.showToast("Failed to load inventory", "danger");
    });

    document.addEventListener("click", function (e) {
      var btn = e.target && e.target.closest ? e.target.closest("[data-remove-item]") : null;
      if (!btn) return;
      if (!currentUser || !ims.canManageInventory(currentUser)) return;
      e.preventDefault();
      e.stopPropagation();
      var itemId = btn.getAttribute("data-item-id");
      if (!itemId) return;
      if (!window.confirm("Remove this item?")) return;
      ims.api
        .delete("/items/" + itemId + "/")
        .then(function () {
          ims.showToast("Item removed", "success");
          allItems = (allItems || []).filter(function (x) {
            return String(x.id) !== String(itemId);
          });
          if (sidebarApi && typeof sidebarApi.setCategoryCounts === "function") {
            sidebarApi.setCategoryCounts(ims.countItemsByCategory(allItems));
          }
          renderRows();
        })
        .catch(function (ex) {
          var msg = (ex.response && ex.response.data && JSON.stringify(ex.response.data)) || "Delete failed";
          ims.showToast(msg, "danger");
        });
    });

    document.getElementById("filterAll").addEventListener("click", function () {
      setActiveCategory("all");
    });

    document.getElementById("searchQ").addEventListener("input", function () {
      clearTimeout(searchTimer);
      searchTimer = setTimeout(renderRows, 180);
    });

    document.getElementById("categoryFilterSelect").addEventListener("change", function () {
      setActiveCategory(this.value);
    });
  })();
</script>
{% endblock %}
