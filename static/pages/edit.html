<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Edit item — IMS</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <style>
      .sidebar {
        min-height: 100vh;
      }
      .sidebar .nav-link {
        color: rgba(255, 255, 255, 0.75);
        border-radius: 0.375rem;
      }
      .sidebar .nav-link:hover,
      .sidebar .nav-link.active {
        color: #fff;
        background: rgba(255, 255, 255, 0.08);
      }
    </style>
  </head>
  <body>
    <div class="container-fluid">
      <div class="row g-0">
        <aside class="col-12 col-md-3 col-xl-2 bg-dark sidebar p-0">
          <div class="d-flex flex-column p-3 text-white h-100">
            <span class="fs-5 fw-semibold mb-3">IMS</span>
            <nav class="nav nav-pills flex-column gap-1">
              <a class="nav-link" href="/">Dashboard</a>
              <a class="nav-link" href="/inventory.html">Inventory</a>
              <a class="nav-link" href="/add.html">Add item</a>
              <a class="nav-link" href="/history.html">Audit log</a>
              <a class="nav-link" href="/import.html">Import CSV</a>
            </nav>
            <div class="mt-auto pt-4">
              <button type="button" class="btn btn-outline-light btn-sm w-100" id="btnLogout">
                Logout
              </button>
            </div>
          </div>
        </aside>
        <main class="col-12 col-md-9 col-xl-10 p-4">
          <h1 class="h3 mb-4">Edit item</h1>
          <div class="card shadow-sm" style="max-width: 640px">
            <div class="card-body">
              <form id="formItem">
                <div class="mb-3">
                  <label class="form-label">Category</label>
                  <select class="form-select" name="category" required id="selCat"></select>
                </div>
                <div class="mb-3">
                  <label class="form-label">Specs</label>
                  <input class="form-control" name="specs" required id="fSpecs" />
                </div>
                <div class="mb-3">
                  <label class="form-label">Capacity</label>
                  <input class="form-control" name="capacity" id="fCap" />
                </div>
                <div class="mb-3">
                  <label class="form-label">Quantity</label>
                  <input class="form-control" type="number" min="0" name="quantity" id="fQty" />
                </div>
                <div class="mb-3">
                  <label class="form-label">Status</label>
                  <select class="form-select" name="status" id="selStatus">
                    <option value="in_stock">In stock</option>
                    <option value="deployed">Deployed</option>
                    <option value="out_of_stock">Out of stock</option>
                    <option value="na">N/A</option>
                    <option value="faulty">Faulty</option>
                  </select>
                </div>
                <div class="mb-3">
                  <label class="form-label">Deployed to</label>
                  <input class="form-control" name="deployed_to" id="fDep" />
                </div>
                <div class="mb-3">
                  <label class="form-label">Remark</label>
                  <textarea class="form-control" name="remark" rows="2" id="fRem"></textarea>
                </div>
                <button type="submit" class="btn btn-primary">Update</button>
                <a href="/inventory.html" class="btn btn-link">Cancel</a>
              </form>
            </div>
          </div>
        </main>
      </div>
    </div>
    <div class="toast-container position-fixed bottom-0 end-0 p-3">
      <div id="toastLive" class="toast align-items-center border-0" role="alert">
        <div class="d-flex">
          <div class="toast-body"></div>
        </div>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios@1.7.7/dist/axios.min.js"></script>
    <script src="/static/js/api.js"></script>
    <script>
      (function () {
        if (!ims.requireAuth()) return;
        document.getElementById("btnLogout").addEventListener("click", function () {
          ims.logout();
        });

        function results(d) {
          return d.results !== undefined ? d.results : d;
        }

        var params = new URLSearchParams(window.location.search);
        var id = params.get("id");
        if (!id) {
          ims.showToast("Missing id", "danger");
          return;
        }

        Promise.all([ims.api.get("/categories/"), ims.api.get("/items/" + id + "/")]).then(function (res) {
          var sel = document.getElementById("selCat");
          results(res[0].data).forEach(function (c) {
            var o = document.createElement("option");
            o.value = c.id;
            o.textContent = c.name;
            sel.appendChild(o);
          });
          var it = res[1].data;
          sel.value = it.category.id;
          document.getElementById("fSpecs").value = it.specs;
          document.getElementById("fCap").value = it.capacity || "";
          document.getElementById("fQty").value = it.quantity;
          document.getElementById("selStatus").value = it.status;
          document.getElementById("fDep").value = it.deployed_to || "";
          document.getElementById("fRem").value = it.remark || "";
        });

        document.getElementById("formItem").addEventListener("submit", function (e) {
          e.preventDefault();
          var fd = new FormData(e.target);
          var payload = {
            category: parseInt(fd.get("category"), 10),
            specs: fd.get("specs"),
            capacity: fd.get("capacity") || "",
            quantity: parseInt(fd.get("quantity") || "0", 10),
            status: fd.get("status"),
            deployed_to: fd.get("deployed_to") || "",
            remark: fd.get("remark") || "",
          };
          ims.api
            .patch("/items/" + id + "/", payload)
            .then(function () {
              ims.showToast("Saved", "success");
              window.location.href = "/item.html?id=" + id;
            })
            .catch(function (ex) {
              var msg =
                (ex.response && ex.response.data && JSON.stringify(ex.response.data)) ||
                "Save failed";
              ims.showToast(msg, "danger");
            });
        });
      })();
    </script>
  </body>
</html>
