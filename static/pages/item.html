<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Item — IMS</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <style>
      .sidebar {
        min-height: 100vh;
      }
      .sidebar .nav-link {
        color: rgba(255, 255, 255, 0.75);
        border-radius: 0.375rem;
      }
      .sidebar .nav-link:hover,
      .sidebar .nav-link.active {
        color: #fff;
        background: rgba(255, 255, 255, 0.08);
      }
      .timeline {
        border-left: 3px solid var(--bs-border-color);
        margin-left: 0.75rem;
        padding-left: 1.25rem;
      }
      .timeline-item {
        position: relative;
        padding-bottom: 1.25rem;
      }
      .timeline-item::before {
        content: "";
        position: absolute;
        left: -1.45rem;
        top: 0.25rem;
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: var(--bs-primary);
      }
    </style>
  </head>
  <body>
    <div class="container-fluid">
      <div class="row g-0">
        <aside class="col-12 col-md-3 col-xl-2 bg-dark sidebar p-0">
          <div class="d-flex flex-column p-3 text-white h-100">
            <span class="fs-5 fw-semibold mb-3">IMS</span>
            <nav class="nav nav-pills flex-column gap-1">
              <a class="nav-link" href="/">Dashboard</a>
              <a class="nav-link" href="/inventory.html">Inventory</a>
              <a class="nav-link" href="/add.html">Add item</a>
              <a class="nav-link" href="/history.html">Audit log</a>
              <a class="nav-link" href="/import.html">Import CSV</a>
            </nav>
            <div class="mt-auto pt-4">
              <button type="button" class="btn btn-outline-light btn-sm w-100" id="btnLogout">
                Logout
              </button>
            </div>
          </div>
        </aside>
        <main class="col-12 col-md-9 col-xl-10 p-4">
          <p class="mb-2"><a href="/inventory.html">← Back to inventory</a></p>
          <div id="detailCard" class="card shadow-sm mb-4">
            <div class="card-body">
              <h1 class="h4" id="titleSpecs">—</h1>
              <p class="text-secondary mb-1" id="titleCat">—</p>
              <div class="row g-2 small">
                <div class="col-md-3"><strong>Capacity</strong><br /><span id="fCap">—</span></div>
                <div class="col-md-3"><strong>Quantity</strong><br /><span id="fQty">—</span></div>
                <div class="col-md-3"><strong>Status</strong><br /><span id="fSt">—</span></div>
                <div class="col-md-3"><strong>Deployed to</strong><br /><span id="fDep">—</span></div>
              </div>
              <p class="mt-3 mb-0"><strong>Remark</strong><br /><span id="fRem">—</span></p>
              <a class="btn btn-primary btn-sm mt-3" id="btnEdit" href="#">Edit</a>
            </div>
          </div>
          <div class="row g-4">
            <div class="col-lg-6">
              <h2 class="h5">Model history</h2>
              <div class="timeline" id="histTimeline"></div>
            </div>
            <div class="col-lg-6">
              <h2 class="h5">Activity log</h2>
              <div class="table-responsive" style="max-height: 420px">
                <table class="table table-sm">
                  <thead class="table-light sticky-top">
                    <tr>
                      <th>When</th>
                      <th>Action</th>
                      <th>Δ Qty</th>
                    </tr>
                  </thead>
                  <tbody id="logBody"></tbody>
                </table>
              </div>
            </div>
          </div>
        </main>
      </div>
    </div>
    <div class="toast-container position-fixed bottom-0 end-0 p-3">
      <div id="toastLive" class="toast align-items-center border-0" role="alert">
        <div class="d-flex">
          <div class="toast-body"></div>
        </div>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios@1.7.7/dist/axios.min.js"></script>
    <script src="/static/js/api.js"></script>
    <script>
      (function () {
        if (!ims.requireAuth()) return;
        document.getElementById("btnLogout").addEventListener("click", function () {
          ims.logout();
        });

        function results(d) {
          return d.results !== undefined ? d.results : d;
        }

        var params = new URLSearchParams(window.location.search);
        var id = params.get("id");
        if (!id) {
          ims.showToast("Missing id", "danger");
          return;
        }
        document.getElementById("btnEdit").href = "/edit.html?id=" + id;

        Promise.all([
          ims.api.get("/items/" + id + "/"),
          ims.api.get("/items/" + id + "/history/?page_size=200"),
          ims.api.get("/items/" + id + "/logs/?page_size=200"),
        ])
          .then(function (res) {
            var it = res[0].data;
            document.getElementById("titleSpecs").textContent = it.specs;
            document.getElementById("titleCat").textContent = it.category ? it.category.name : "";
            document.getElementById("fCap").textContent = it.capacity || "—";
            document.getElementById("fQty").textContent = it.quantity;
            document.getElementById("fSt").innerHTML = ims.statusBadge(it.status);
            document.getElementById("fDep").textContent = it.deployed_to || "—";
            document.getElementById("fRem").textContent = it.remark || "—";

            var hist = results(res[1].data);
            var ht = document.getElementById("histTimeline");
            ht.innerHTML = "";
            hist.forEach(function (h) {
              var div = document.createElement("div");
              div.className = "timeline-item";
              var when = h.history_date ? new Date(h.history_date).toLocaleString() : "";
              div.innerHTML =
                "<div class=\"small text-secondary\">" +
                when +
                "</div><div>Qty " +
                h.quantity +
                " · " +
                ims.statusBadge(h.status) +
                "</div><div class=\"small\">" +
                (h.history_change_reason || "") +
                "</div>";
              ht.appendChild(div);
            });

            var logs = results(res[2].data);
            var lb = document.getElementById("logBody");
            lb.innerHTML = "";
            logs.forEach(function (log) {
              var tr = document.createElement("tr");
              tr.innerHTML =
                "<td><small>" +
                new Date(log.timestamp).toLocaleString() +
                "</small></td><td>" +
                log.action +
                "</td><td>" +
                log.quantity_before +
                " → " +
                log.quantity_after +
                "</td>";
              lb.appendChild(tr);
            });
          })
          .catch(function () {
            ims.showToast("Could not load item", "danger");
          });
      })();
    </script>
  </body>
</html>
