<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Inventory — IMS</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <style>
      .sidebar {
        min-height: 100vh;
      }
      .sidebar .nav-link {
        color: rgba(255, 255, 255, 0.75);
        border-radius: 0.375rem;
      }
      .sidebar .nav-link:hover,
      .sidebar .nav-link.active {
        color: #fff;
        background: rgba(255, 255, 255, 0.08);
      }
    </style>
  </head>
  <body>
    <div class="container-fluid">
      <div class="row g-0">
        <aside class="col-12 col-md-3 col-xl-2 bg-dark sidebar p-0">
          <div class="d-flex flex-column p-3 text-white h-100">
            <span class="fs-5 fw-semibold mb-3">IMS</span>
            <nav class="nav nav-pills flex-column gap-1">
              <a class="nav-link" href="/">Dashboard</a>
              <a class="nav-link active" href="/inventory.html">Inventory</a>
              <a class="nav-link" href="/add.html">Add item</a>
              <a class="nav-link" href="/history.html">Audit log</a>
              <a class="nav-link" href="/import.html">Import CSV</a>
            </nav>
            <div class="mt-auto pt-4">
              <button type="button" class="btn btn-outline-light btn-sm w-100" id="btnLogout">
                Logout
              </button>
            </div>
          </div>
        </aside>
        <main class="col-12 col-md-9 col-xl-10 p-4">
          <h1 class="h3 mb-3">Inventory</h1>
          <ul class="nav nav-tabs flex-nowrap overflow-auto" id="catTabs" role="tablist"></ul>
          <div class="tab-content border border-top-0 rounded-bottom p-3 bg-white shadow-sm">
            <div class="mb-3">
              <input
                type="search"
                class="form-control form-control-sm"
                id="searchQ"
                placeholder="Search specs, capacity, remark…"
              />
            </div>
            <div class="table-responsive" style="max-height: 70vh">
              <table class="table table-sm table-hover align-middle mb-0">
                <thead class="table-light sticky-top">
                  <tr>
                    <th>Specs</th>
                    <th>Capacity</th>
                    <th>Qty</th>
                    <th>Status</th>
                    <th>Deployed to</th>
                    <th></th>
                  </tr>
                </thead>
                <tbody id="tblBody"></tbody>
              </table>
            </div>
          </div>
        </main>
      </div>
    </div>
    <div class="toast-container position-fixed bottom-0 end-0 p-3">
      <div id="toastLive" class="toast align-items-center border-0" role="alert">
        <div class="d-flex">
          <div class="toast-body"></div>
        </div>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios@1.7.7/dist/axios.min.js"></script>
    <script src="/static/js/api.js"></script>
    <script>
      (function () {
        if (!ims.requireAuth()) return;
        document.getElementById("btnLogout").addEventListener("click", function () {
          ims.logout();
        });

      function results(d) {
        return d.results !== undefined ? d.results : d;
      }

      var allItems = [];
      var activeCatId = "all";
      var searchTimer;

      function renderRows() {
        var tb = document.getElementById("tblBody");
        tb.innerHTML = "";
        var q = (document.getElementById("searchQ").value || "").toLowerCase();
        allItems.forEach(function (it) {
          if (activeCatId !== "all" && String(it.category.id) !== String(activeCatId)) return;
          if (q) {
            var blob =
              (it.specs || "") +
              " " +
              (it.capacity || "") +
              " " +
              (it.remark || "");
            if (blob.toLowerCase().indexOf(q) < 0) return;
          }
          var tr = document.createElement("tr");
          tr.innerHTML =
            "<td>" +
            it.specs +
            "</td><td>" +
            (it.capacity || "—") +
            "</td><td>" +
            it.quantity +
            "</td><td>" +
            ims.statusBadge(it.status) +
            "</td><td><small>" +
            (it.deployed_to || "—") +
            '</small></td><td><a class="btn btn-sm btn-outline-primary" href="/item.html?id=' +
            it.id +
            '">View</a> <a class="btn btn-sm btn-outline-secondary" href="/edit.html?id=' +
            it.id +
            '">Edit</a></td>';
          tb.appendChild(tr);
        });
      }

      Promise.all([
        ims.api.get("/categories/"),
        ims.api.get("/items/?page_size=1000&ordering=specs"),
      ])
        .then(function (res) {
          var cats = results(res[0].data);
          var tabHost = document.getElementById("catTabs");
          var paneId = 0;
          function addTab(id, label, active) {
            var li = document.createElement("li");
            li.className = "nav-item";
            li.innerHTML =
              '<button class="nav-link' +
              (active ? " active" : "") +
              '" data-cat="' +
              id +
              '" type="button" role="tab">' +
              label +
              "</button>";
            tabHost.appendChild(li);
          }
          addTab("all", "All", true);
          cats.forEach(function (c) {
            addTab(String(c.id), c.full_name || c.name, false);
          });
          allItems = results(res[1].data);
          renderRows();
          tabHost.addEventListener("click", function (e) {
            var btn = e.target.closest("button[data-cat]");
            if (!btn) return;
            activeCatId = btn.getAttribute("data-cat");
            tabHost.querySelectorAll("button").forEach(function (b) {
              b.classList.toggle("active", b === btn);
            });
            renderRows();
          });
        })
        .catch(function () {
          ims.showToast("Failed to load inventory", "danger");
        });

        document.getElementById("searchQ").addEventListener("input", function () {
          clearTimeout(searchTimer);
          searchTimer = setTimeout(renderRows, 200);
        });
      })();
    </script>
  </body>
</html>
