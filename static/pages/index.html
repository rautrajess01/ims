<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dashboard — Inventory</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <style>
      .sidebar {
        min-height: 100vh;
      }
      .sidebar .nav-link {
        color: rgba(255, 255, 255, 0.75);
        border-radius: 0.375rem;
      }
      .sidebar .nav-link:hover,
      .sidebar .nav-link.active {
        color: #fff;
        background: rgba(255, 255, 255, 0.08);
      }
    </style>
  </head>
  <body>
    <div class="container-fluid">
      <div class="row g-0">
        <aside class="col-12 col-md-3 col-xl-2 bg-dark sidebar p-0">
          <div class="d-flex flex-column p-3 text-white h-100">
            <span class="fs-5 fw-semibold mb-3">IMS</span>
            <nav class="nav nav-pills flex-column gap-1">
              <a class="nav-link active" href="/">Dashboard</a>
              <a class="nav-link" href="/inventory.html">Inventory</a>
              <a class="nav-link" href="/add.html">Add item</a>
              <a class="nav-link" href="/history.html">Audit log</a>
              <a class="nav-link" href="/import.html">Import CSV</a>
            </nav>
            <div class="mt-auto pt-4">
              <button type="button" class="btn btn-outline-light btn-sm w-100" id="btnLogout">
                Logout
              </button>
            </div>
          </div>
        </aside>
        <main class="col-12 col-md-9 col-xl-10 p-4">
          <h1 class="h3 mb-4">Dashboard</h1>
          <div class="row g-3 mb-4">
            <div class="col-md-4">
              <div class="card h-100 shadow-sm">
                <div class="card-body">
                  <div class="text-secondary small">Total SKUs</div>
                  <div class="display-6" id="totalItems">—</div>
                </div>
              </div>
            </div>
          </div>
          <div class="row g-3 mb-4">
            <div class="col-lg-6">
              <div class="card shadow-sm h-100">
                <div class="card-header">By category</div>
                <div class="card-body">
                  <ul class="list-group list-group-flush" id="byCat"></ul>
                </div>
              </div>
            </div>
            <div class="col-lg-6">
              <div class="card shadow-sm h-100">
                <div class="card-header">By status</div>
                <div class="card-body">
                  <ul class="list-group list-group-flush" id="byStatus"></ul>
                </div>
              </div>
            </div>
          </div>
          <div class="row g-3">
            <div class="col-lg-7">
              <div class="card shadow-sm">
                <div class="card-header">Recent activity</div>
                <div class="card-body p-0">
                  <div class="table-responsive" style="max-height: 360px">
                    <table class="table table-sm table-hover mb-0">
                      <thead class="table-light sticky-top">
                        <tr>
                          <th>When</th>
                          <th>Action</th>
                          <th>Item</th>
                          <th>User</th>
                        </tr>
                      </thead>
                      <tbody id="recentBody"></tbody>
                    </table>
                  </div>
                </div>
              </div>
            </div>
            <div class="col-lg-5">
              <div class="card shadow-sm">
                <div class="card-header">Low stock (≤ 2)</div>
                <div class="card-body p-0">
                  <div class="table-responsive" style="max-height: 360px">
                    <table class="table table-sm mb-0">
                      <thead class="table-light sticky-top">
                        <tr>
                          <th>Item</th>
                          <th>Qty</th>
                          <th></th>
                        </tr>
                      </thead>
                      <tbody id="lowStockBody"></tbody>
                    </table>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </main>
      </div>
    </div>
    <div class="toast-container position-fixed bottom-0 end-0 p-3">
      <div id="toastLive" class="toast align-items-center border-0" role="alert">
        <div class="d-flex">
          <div class="toast-body"></div>
        </div>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios@1.7.7/dist/axios.min.js"></script>
    <script src="/static/js/api.js"></script>
    <script>
      (function () {
        if (!ims.requireAuth()) return;
        document.getElementById("btnLogout").addEventListener("click", function () {
          ims.logout();
        });
        ims.api
        .get("/dashboard/")
        .then(function (res) {
          var d = res.data;
          document.getElementById("totalItems").textContent = d.total_items;
          var catEl = document.getElementById("byCat");
          catEl.innerHTML = "";
          Object.keys(d.count_by_category).forEach(function (k) {
            var li = document.createElement("li");
            li.className = "list-group-item d-flex justify-content-between";
            li.innerHTML = "<span>" + k + "</span><span>" + d.count_by_category[k] + "</span>";
            catEl.appendChild(li);
          });
          var stEl = document.getElementById("byStatus");
          stEl.innerHTML = "";
          Object.keys(d.count_by_status).forEach(function (k) {
            var li = document.createElement("li");
            li.className = "list-group-item d-flex justify-content-between align-items-center";
            li.innerHTML =
              "<span>" +
              ims.statusBadge(k) +
              ' <span class="ms-1">' +
              k.replace(/_/g, " ") +
              "</span></span><span>" +
              d.count_by_status[k] +
              "</span>";
            stEl.appendChild(li);
          });
          var rb = document.getElementById("recentBody");
          rb.innerHTML = "";
          d.recent_logs.forEach(function (log) {
            var tr = document.createElement("tr");
            var spec = log.item ? log.item.specs : "—";
            var user = log.performed_by ? log.performed_by.username : "—";
            tr.innerHTML =
              "<td><small>" +
              new Date(log.timestamp).toLocaleString() +
              "</small></td><td>" +
              log.action +
              "</td><td>" +
              spec +
              "</td><td>" +
              user +
              "</td>";
            rb.appendChild(tr);
          });
          var lb = document.getElementById("lowStockBody");
          lb.innerHTML = "";
          d.low_stock_items.forEach(function (it) {
            var tr = document.createElement("tr");
            tr.innerHTML =
              "<td>" +
              it.specs +
              "</td><td>" +
              it.quantity +
              '</td><td><a class="btn btn-sm btn-outline-primary" href="/item.html?id=' +
              it.id +
              '">View</a></td>';
            lb.appendChild(tr);
          });
        })
        .catch(function () {
          ims.showToast("Could not load dashboard", "danger");
        });
      })();
    </script>
  </body>
</html>
