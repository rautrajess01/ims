<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Audit log — IMS</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <style>
      .sidebar {
        min-height: 100vh;
      }
      .sidebar .nav-link {
        color: rgba(255, 255, 255, 0.75);
        border-radius: 0.375rem;
      }
      .sidebar .nav-link:hover,
      .sidebar .nav-link.active {
        color: #fff;
        background: rgba(255, 255, 255, 0.08);
      }
    </style>
  </head>
  <body>
    <div class="container-fluid">
      <div class="row g-0">
        <aside class="col-12 col-md-3 col-xl-2 bg-dark sidebar p-0">
          <div class="d-flex flex-column p-3 text-white h-100">
            <span class="fs-5 fw-semibold mb-3">IMS</span>
            <nav class="nav nav-pills flex-column gap-1">
              <a class="nav-link" href="/">Dashboard</a>
              <a class="nav-link" href="/inventory.html">Inventory</a>
              <a class="nav-link" href="/add.html">Add item</a>
              <a class="nav-link active" href="/history.html">Audit log</a>
              <a class="nav-link" href="/import.html">Import CSV</a>
            </nav>
            <div class="mt-auto pt-4">
              <button type="button" class="btn btn-outline-light btn-sm w-100" id="btnLogout">
                Logout
              </button>
            </div>
          </div>
        </aside>
        <main class="col-12 col-md-9 col-xl-10 p-4">
          <h1 class="h3 mb-3">Audit log</h1>
          <div class="card shadow-sm mb-3">
            <div class="card-body row g-2 small">
              <div class="col-md-3">
                <label class="form-label">Action</label>
                <select class="form-select form-select-sm" id="fAction">
                  <option value="">Any</option>
                  <option value="added">added</option>
                  <option value="deployed">deployed</option>
                  <option value="returned">returned</option>
                  <option value="removed">removed</option>
                  <option value="faulty">faulty</option>
                  <option value="qty_changed">qty_changed</option>
                  <option value="remark_updated">remark_updated</option>
                </select>
              </div>
              <div class="col-md-3">
                <label class="form-label">Category</label>
                <select class="form-select form-select-sm" id="fCat"></select>
              </div>
              <div class="col-md-3">
                <label class="form-label">From (ISO)</label>
                <input class="form-control form-control-sm" id="fFrom" placeholder="2026-01-01T00:00:00Z" />
              </div>
              <div class="col-md-3">
                <label class="form-label">To (ISO)</label>
                <input class="form-control form-control-sm" id="fTo" placeholder="2026-12-31T23:59:59Z" />
              </div>
              <div class="col-md-3">
                <label class="form-label">User id</label>
                <input class="form-control form-control-sm" id="fUser" placeholder="performed_by" />
              </div>
              <div class="col-12">
                <button type="button" class="btn btn-sm btn-primary" id="btnApply">Apply filters</button>
              </div>
            </div>
          </div>
          <div class="table-responsive" style="max-height: 75vh">
            <table class="table table-sm table-hover align-middle">
              <thead class="table-light sticky-top">
                <tr>
                  <th>When</th>
                  <th>Action</th>
                  <th>Item</th>
                  <th>Category</th>
                  <th>Qty Δ</th>
                  <th>User</th>
                  <th>Notes</th>
                </tr>
              </thead>
              <tbody id="tblBody"></tbody>
            </table>
          </div>
          <nav class="mt-2" id="pager"></nav>
        </main>
      </div>
    </div>
    <div class="toast-container position-fixed bottom-0 end-0 p-3">
      <div id="toastLive" class="toast align-items-center border-0" role="alert">
        <div class="d-flex">
          <div class="toast-body"></div>
        </div>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios@1.7.7/dist/axios.min.js"></script>
    <script src="/static/js/api.js"></script>
    <script>
      (function () {
        if (!ims.requireAuth()) return;
        document.getElementById("btnLogout").addEventListener("click", function () {
          ims.logout();
        });

        function results(d) {
          return d.results !== undefined ? d.results : d;
        }

        function relApiUrl(fullUrl) {
          if (!fullUrl) return null;
          try {
            var u = new URL(fullUrl, window.location.origin);
            return u.pathname + u.search;
          } catch (e) {
            return fullUrl;
          }
        }

        var nextUrl = null;
        var prevUrl = null;

        function load(url) {
          ims.api
            .get(url || "/logs/?page_size=50&ordering=-timestamp")
            .then(function (res) {
              var d = res.data;
              var rows = results(d);
              var tb = document.getElementById("tblBody");
              tb.innerHTML = "";
              rows.forEach(function (log) {
                var tr = document.createElement("tr");
                var spec = log.item ? log.item.specs : "—";
                var cat = log.item && log.item.category ? (log.item.category.full_name || log.item.category.name) : "—";
                var user = log.performed_by ? log.performed_by.username : "—";
                tr.innerHTML =
                  "<td><small>" +
                  new Date(log.timestamp).toLocaleString() +
                  "</small></td><td>" +
                  log.action +
                  "</td><td>" +
                  spec +
                  "</td><td>" +
                  cat +
                  "</td><td>" +
                  log.quantity_before +
                  " → " +
                  log.quantity_after +
                  "</td><td>" +
                  user +
                  "</td><td><small>" +
                  (log.notes || "").replace(/</g, "&lt;") +
                  "</small></td>";
                tb.appendChild(tr);
              });
              nextUrl = d.next;
              prevUrl = d.previous;
              var pg = document.getElementById("pager");
              pg.innerHTML =
                '<button class="btn btn-sm btn-outline-secondary me-2" id="pgPrev" ' +
                (prevUrl ? "" : "disabled") +
                '>Previous</button><button class="btn btn-sm btn-outline-secondary" id="pgNext" ' +
                (nextUrl ? "" : "disabled") +
                ">Next</button>";
              document.getElementById("pgPrev").onclick = function () {
                var p = relApiUrl(prevUrl);
                if (p) load(p);
              };
              document.getElementById("pgNext").onclick = function () {
                var n = relApiUrl(nextUrl);
                if (n) load(n);
              };
            })
            .catch(function () {
              ims.showToast("Failed to load logs", "danger");
            });
        }

        ims.api.get("/categories/").then(function (res) {
          var sel = document.getElementById("fCat");
          var o0 = document.createElement("option");
          o0.value = "";
          o0.textContent = "Any";
          sel.appendChild(o0);
          results(res.data).forEach(function (c) {
            var o = document.createElement("option");
            o.value = c.id;
            o.textContent = c.full_name || c.name;
            sel.appendChild(o);
          });
        });

        document.getElementById("btnApply").addEventListener("click", function () {
          var q = "/logs/?page_size=50&ordering=-timestamp";
          var a = document.getElementById("fAction").value;
          var c = document.getElementById("fCat").value;
          var f = document.getElementById("fFrom").value.trim();
          var t = document.getElementById("fTo").value.trim();
          var u = document.getElementById("fUser").value.trim();
          if (a) q += "&action=" + encodeURIComponent(a);
          if (c) q += "&category=" + encodeURIComponent(c);
          if (f) q += "&timestamp_after=" + encodeURIComponent(f);
          if (t) q += "&timestamp_before=" + encodeURIComponent(t);
          if (u) q += "&performed_by=" + encodeURIComponent(u);
          load(q);
        });

        load();
      })();
    </script>
  </body>
</html>
