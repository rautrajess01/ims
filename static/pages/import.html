<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Import CSV — IMS</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <style>
      .sidebar {
        min-height: 100vh;
      }
      .sidebar .nav-link {
        color: rgba(255, 255, 255, 0.75);
        border-radius: 0.375rem;
      }
      .sidebar .nav-link:hover,
      .sidebar .nav-link.active {
        color: #fff;
        background: rgba(255, 255, 255, 0.08);
      }
    </style>
  </head>
  <body>
    <div class="container-fluid">
      <div class="row g-0">
        <aside class="col-12 col-md-3 col-xl-2 bg-dark sidebar p-0">
          <div class="d-flex flex-column p-3 text-white h-100">
            <span class="fs-5 fw-semibold mb-3">IMS</span>
            <nav class="nav nav-pills flex-column gap-1">
              <a class="nav-link" href="/">Dashboard</a>
              <a class="nav-link" href="/inventory.html">Inventory</a>
              <a class="nav-link" href="/add.html">Add item</a>
              <a class="nav-link" href="/history.html">Audit log</a>
              <a class="nav-link active" href="/import.html">Import CSV</a>
            </nav>
            <div class="mt-auto pt-4">
              <button type="button" class="btn btn-outline-light btn-sm w-100" id="btnLogout">
                Logout
              </button>
            </div>
          </div>
        </aside>
        <main class="col-12 col-md-9 col-xl-10 p-4">
          <h1 class="h3 mb-3">Import CSV</h1>
          <p class="text-secondary">
            Required columns: <code>category</code>, <code>specs</code>, <code>capacity</code>,
            <code>quantity</code>, <code>status</code>. Optional: <code>deployed_to</code>,
            <code>remark</code>. Category must match an existing name.
          </p>
          <div class="card shadow-sm" style="max-width: 520px">
            <div class="card-body">
              <form id="formImport">
                <input type="file" class="form-control mb-3" name="file" accept=".csv,text/csv" required />
                <button type="submit" class="btn btn-primary">Upload</button>
                <button type="button" class="btn btn-outline-secondary" id="btnExport">Download CSV export</button>
              </form>
              <pre class="small bg-light p-2 mt-3 mb-0 d-none" id="out"></pre>
            </div>
          </div>
        </main>
      </div>
    </div>
    <div class="toast-container position-fixed bottom-0 end-0 p-3">
      <div id="toastLive" class="toast align-items-center border-0" role="alert">
        <div class="d-flex">
          <div class="toast-body"></div>
        </div>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios@1.7.7/dist/axios.min.js"></script>
    <script src="/static/js/api.js"></script>
    <script>
      (function () {
        if (!ims.requireAuth()) return;
        document.getElementById("btnLogout").addEventListener("click", function () {
          ims.logout();
        });

        document.getElementById("btnExport").addEventListener("click", function () {
          ims.api
            .get("/export/", { responseType: "blob" })
            .then(function (res) {
              var url = URL.createObjectURL(res.data);
              var a = document.createElement("a");
              a.href = url;
              a.download = "inventory_export.csv";
              a.click();
              URL.revokeObjectURL(url);
            })
            .catch(function () {
              ims.showToast("Export failed", "danger");
            });
        });

        document.getElementById("formImport").addEventListener("submit", function (e) {
          e.preventDefault();
          var fd = new FormData();
          fd.append("file", e.target.file.files[0]);
          ims.api
            .post("/import/", fd)
            .then(function (res) {
              ims.showToast("Imported " + res.data.created + " rows", "success");
              var pre = document.getElementById("out");
              pre.classList.remove("d-none");
              pre.textContent = JSON.stringify(res.data, null, 2);
            })
            .catch(function () {
              ims.showToast("Import failed", "danger");
            });
        });
      })();
    </script>
  </body>
</html>
